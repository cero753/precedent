[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precedent"
version = "0.1.0"
description = "Precedent: agentic decision memory for marketing agencies. Captures why decisions were made, judges them fairly, survives changing facts and deletion, and gates every agent action by risk."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kartik Bhardwaj" }]
requires-python = ">=3.10"
dependencies = ["streamlit>=1.35", "pandas"]
keywords = ["ai-agents", "agent-memory", "human-in-the-loop", "evals", "llm", "marketing", "bitemporal"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/cero753/precedent"

[project.scripts]
precedent = "ledger.cli:main"

[tool.setuptools]
packages = ["ledger", "evals"]

[tool.setuptools.package-data]
evals = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
